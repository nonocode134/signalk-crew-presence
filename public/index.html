<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew Presence — Signal K</title>
  <style>
    :root {
      --bg: #0d1b2a;
      --surface: #1a2d42;
      --surface2: #223854;
      --border: #2e4a68;
      --text: #e8f0f8;
      --muted: #7a9bbf;
      --accent: #0088cc;
      --ok: #2dc653;
      --alarm: #e63946;
      --warn: #f0a500;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      flex: 1;
    }

    header h1 span {
      color: var(--accent);
      margin-right: 0.4rem;
    }

    #status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    #status-badge.armed { background: rgba(230,57,70,0.15); color: var(--alarm); border-color: var(--alarm); }
    #status-badge.ok { background: rgba(45,198,83,0.15); color: var(--ok); border-color: var(--ok); }

    .btn {
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.97); }

    .btn-arm   { background: var(--alarm); color: #fff; }
    .btn-disarm { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .btn-save  { background: var(--accent); color: #fff; }
    .btn-sm    { padding: 0.3rem 0.7rem; font-size: 0.78rem; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .section-header {
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-header .count {
      background: var(--surface2);
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
      font-size: 0.7rem;
    }

    /* Crew cards */
    #crew-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      padding: 1.2rem;
    }

    .crew-card {
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      position: relative;
      transition: border-color 0.3s;
    }

    .crew-card.present { border-color: var(--ok); }
    .crew-card.alarming { border-color: var(--alarm); animation: pulse 1.5s infinite; }
    .crew-card.unknown { border-color: var(--border); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(230,57,70,0); }
    }

    .crew-name {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .crew-mac {
      font-size: 0.7rem;
      color: var(--muted);
      font-family: monospace;
      margin-bottom: 0.6rem;
    }

    .crew-status-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 0.4rem;
      vertical-align: middle;
    }

    .crew-status-dot.ok     { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .crew-status-dot.alarm  { background: var(--alarm); }
    .crew-status-dot.unknown { background: var(--muted); }

    .crew-seen {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .empty-msg {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Detected devices table */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      padding: 0.7rem 1rem;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .mac { font-family: monospace; font-size: 0.82rem; }
    .rssi-bar { display: flex; align-items: center; gap: 0.4rem; }
    .rssi-val { font-size: 0.78rem; color: var(--muted); }

    .signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
    }

    .signal-bars span {
      width: 4px;
      background: var(--border);
      border-radius: 2px;
    }

    .signal-bars span:nth-child(1) { height: 4px; }
    .signal-bars span:nth-child(2) { height: 8px; }
    .signal-bars span:nth-child(3) { height: 12px; }
    .signal-bars span:nth-child(4) { height: 16px; }

    .signal-bars.s1 span:nth-child(1) { background: var(--alarm); }
    .signal-bars.s2 span:nth-child(1),
    .signal-bars.s2 span:nth-child(2) { background: var(--warn); }
    .signal-bars.s3 span:nth-child(1),
    .signal-bars.s3 span:nth-child(2),
    .signal-bars.s3 span:nth-child(3) { background: var(--ok); }
    .signal-bars.s4 span { background: var(--ok); }

    .assign-wrap { position: relative; }
    .assign-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 0.25rem 0.5rem;
      font-size: 0.78rem;
      cursor: pointer;
    }

    /* Settings */
    #settings-form {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="number"],
    input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.55rem 0.8rem;
      font-size: 0.9rem;
      width: 100%;
      max-width: 260px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    #crew-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .crew-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .crew-row input { flex: 1; max-width: none; }

    .btn-remove {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 5px;
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      font-size: 0.85rem;
      line-height: 1;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-remove:hover { color: var(--alarm); border-color: var(--alarm); }

    .btn-add {
      background: none;
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      width: 100%;
      transition: color 0.15s, border-color 0.15s;
      margin-top: 0.2rem;
    }
    .btn-add:hover { color: var(--accent); border-color: var(--accent); }

    .form-actions {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    #save-msg {
      font-size: 0.82rem;
      color: var(--ok);
      opacity: 0;
      transition: opacity 0.3s;
    }

    #save-msg.visible { opacity: 1; }

    .refresh-indicator {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      color: var(--muted);
      margin-left: auto;
    }

    .dot-live {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ok);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

<header>
  <h1><span>⚓</span> Crew Presence</h1>
  <span id="status-badge">Chargement…</span>
  <button class="btn btn-arm" id="btn-arm" onclick="arm()">ARM</button>
  <button class="btn btn-disarm" id="btn-disarm" onclick="disarm()">DISARM</button>
</header>

<main>

  <!-- Crew status -->
  <section>
    <div class="section-header">
      Équipage
      <span class="count" id="crew-count">—</span>
      <div class="refresh-indicator" style="margin-left:auto">
        <div class="dot-live"></div> live
      </div>
    </div>
    <div id="crew-grid">
      <div class="empty-msg">Aucun membre configuré</div>
    </div>
  </section>

  <!-- Detected devices -->
  <section>
    <div class="section-header">
      Devices BLE détectés
      <span class="count" id="devices-count">0</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>MAC</th>
            <th>Nom</th>
            <th>Signal</th>
            <th>Vu il y a</th>
            <th>Assigner</th>
          </tr>
        </thead>
        <tbody id="devices-body">
          <tr><td colspan="5" class="empty-msg">Scan en cours…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Settings -->
  <section>
    <div class="section-header">Réglages</div>
    <form id="settings-form" onsubmit="saveConfig(event)">
      <div class="field-group">
        <label for="timeout">Délai d'alarme (secondes)</label>
        <input type="number" id="timeout" min="5" max="3600" value="30">
      </div>

      <div class="field-group">
        <label>Membres d'équipage</label>
        <div id="crew-list"></div>
        <button type="button" class="btn-add" onclick="addCrewRow()">+ Ajouter un membre</button>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-save">Sauvegarder</button>
        <span id="save-msg">Configuration sauvegardée</span>
      </div>
    </form>
  </section>

</main>

<script>
  const API = '/plugins/signalk-crew-presence';

  let currentConfig = { alarmTimeoutSeconds: 30, crewMembers: [] };
  let settingsLoaded = false;
  let deviceRenderPending = true; // render devices on first fetch, then every 8s

  function ago(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s/60)}m ${s%60}s`;
    return `${Math.floor(s/3600)}h`;
  }

  function signalClass(rssi) {
    if (rssi >= -60) return 's4';
    if (rssi >= -70) return 's3';
    if (rssi >= -80) return 's2';
    return 's1';
  }

  function renderCrewGrid(presenceState, armed) {
    const grid = document.getElementById('crew-grid');
    const count = document.getElementById('crew-count');

    if (!presenceState || presenceState.length === 0) {
      grid.innerHTML = '<div class="empty-msg">Aucun membre configuré — ajoutez des membres dans Réglages</div>';
      count.textContent = '0';
      return;
    }

    count.textContent = presenceState.length;

    // Remove placeholder if present
    const placeholder = grid.querySelector('.empty-msg');
    if (placeholder) placeholder.remove();

    // Index existing cards
    const existing = new Map();
    for (const card of grid.querySelectorAll('.crew-card[data-mac]')) {
      existing.set(card.dataset.mac, card);
    }

    // Remove cards no longer in presenceState
    const activeMacs = new Set(presenceState.map(e => e.member.macAddress));
    for (const [mac, card] of existing) {
      if (!activeMacs.has(mac)) { card.remove(); existing.delete(mac); }
    }

    for (const entry of presenceState) {
      const mac = entry.member.macAddress;
      let cardClass = 'unknown', dotClass = 'unknown', statusText = 'Non armé';
      if (armed) {
        if (entry.alarming)      { cardClass = 'alarming'; dotClass = 'alarm'; statusText = 'ALARME'; }
        else if (entry.present)  { cardClass = 'present';  dotClass = 'ok';    statusText = 'À bord'; }
        else                     {                                               statusText = 'En attente…'; }
      }
      const seenText = entry.lastSeen ? `Vu il y a ${ago(entry.lastSeen)}` : 'Jamais détecté';

      let card = existing.get(mac);
      if (!card) {
        card = document.createElement('div');
        card.dataset.mac = mac;
        card.innerHTML = `
          <div class="crew-name">${esc(entry.member.name)}</div>
          <div class="crew-mac">${esc(mac)}</div>
          <div><span class="crew-status-dot"></span><span class="crew-status-text" style="font-size:.82rem"></span></div>
          <div class="crew-seen"></div>`;
        grid.appendChild(card);
      }

      // Update class only if changed (preserves CSS animation state)
      const newClass = `crew-card ${cardClass}`;
      if (card.className !== newClass) card.className = newClass;
      card.querySelector('.crew-status-dot').className = `crew-status-dot ${dotClass}`;
      card.querySelector('.crew-status-text').textContent = statusText;
      card.querySelector('.crew-seen').textContent = seenText;
    }
  }

  function rssiHTML(rssi) {
    return `<div class="rssi-bar">
      <div class="signal-bars ${signalClass(rssi)}"><span></span><span></span><span></span><span></span></div>
      <span class="rssi-val">${rssi} dBm</span>
    </div>`;
  }

  function assignCtrlHTML(d, crewMembers, isAssigned) {
    const options = crewMembers.map(m =>
      `<option value="${esc(m.name)}" ${m.macAddress.toLowerCase() === d.mac ? 'selected' : ''}>${esc(m.name)}</option>`
    ).join('');
    return isAssigned
      ? `<select class="assign-select" onchange="reassign('${esc(d.mac)}', this.value)">
           ${options}<option value="">— Désassigner</option>
         </select>`
      : `<select class="assign-select" onchange="assignDevice('${esc(d.mac)}','${esc(d.name||'')}',this.value)">
           <option value="">Assigner à…</option>
           ${crewMembers.map(m => `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('')}
           <option value="__new__">+ Nouveau membre</option>
         </select>`;
  }

  function renderDevices(devices, crewMembers) {
    const tbody = document.getElementById('devices-body');
    const count = document.getElementById('devices-count');

    // Stable sort: alphabetical by MAC — rows never reorder between refreshes
    const sorted = [...devices].sort((a, b) => a.mac.localeCompare(b.mac));
    count.textContent = sorted.length;

    if (sorted.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Aucun device BLE détecté</td></tr>';
      return;
    }

    // Remove placeholder if present
    const placeholder = tbody.querySelector('td[colspan]');
    if (placeholder) placeholder.closest('tr').remove();

    const assignedMacs = new Set(crewMembers.map(m => m.macAddress.toLowerCase()));

    // Index existing rows
    const existing = new Map();
    for (const tr of tbody.querySelectorAll('tr[data-mac]')) {
      existing.set(tr.dataset.mac, tr);
    }

    // Remove rows no longer in list
    const activeMacs = new Set(sorted.map(d => d.mac));
    for (const [mac, tr] of existing) {
      if (!activeMacs.has(mac)) { tr.remove(); existing.delete(mac); }
    }

    // Update or create rows
    for (const d of sorted) {
      const isAssigned = assignedMacs.has(d.mac);
      let tr = existing.get(d.mac);

      if (!tr) {
        tr = document.createElement('tr');
        tr.dataset.mac = d.mac;
        tr.dataset.assigned = '';
        tr.innerHTML = `
          <td class="mac">${esc(d.mac)}</td>
          <td>${esc(d.name || '—')}</td>
          <td>${rssiHTML(d.rssi)}</td>
          <td>${ago(d.lastSeen)}</td>
          <td class="assign-wrap">${assignCtrlHTML(d, crewMembers, isAssigned)}</td>`;
        tbody.appendChild(tr);
        tr.dataset.assigned = String(isAssigned);
      } else {
        // Partial update: only touch cells that change
        const nameVal = d.name || '—';
        if (tr.cells[1].textContent !== nameVal) tr.cells[1].textContent = nameVal;
        tr.cells[2].innerHTML = rssiHTML(d.rssi);
        tr.cells[3].textContent = ago(d.lastSeen);
        if (tr.dataset.assigned !== String(isAssigned)) {
          tr.cells[4].innerHTML = assignCtrlHTML(d, crewMembers, isAssigned);
          tr.dataset.assigned = String(isAssigned);
        }
      }
    }

    // Reorder DOM to match stable MAC sort (appendChild moves existing nodes)
    const rowMap = new Map();
    for (const tr of tbody.querySelectorAll('tr[data-mac]')) rowMap.set(tr.dataset.mac, tr);
    for (const d of sorted) tbody.appendChild(rowMap.get(d.mac));
  }

  function updateStatusBadge(armed, presenceState) {
    const badge = document.getElementById('status-badge');
    if (!armed) {
      badge.textContent = 'Désarmé';
      badge.className = '';
      return;
    }
    const alarming = presenceState.some(e => e.alarming);
    if (alarming) {
      badge.textContent = 'ALARME';
      badge.className = 'armed';
    } else {
      badge.textContent = 'Armé — OK';
      badge.className = 'ok';
    }
  }

  async function refresh() {
    try {
      const r = await fetch(`${API}/api/status`);
      if (!r.ok) return;
      const data = await r.json();

      // Crew cards: always, every 2s
      renderCrewGrid(data.presenceState, data.armed);
      updateStatusBadge(data.armed, data.presenceState);

      if (!settingsLoaded) {
        loadSettings(data.config);
        settingsLoaded = true;
      }
      currentConfig = data.config;

      // Devices table: only when due (initially + every 8s)
      if (deviceRenderPending) {
        renderDevices(data.detectedDevices, data.config.crewMembers);
        deviceRenderPending = false;
        setTimeout(() => { deviceRenderPending = true; }, 8000);
      }
    } catch (_) {}
  }

  function loadSettings(config) {
    document.getElementById('timeout').value = config.alarmTimeoutSeconds;
    renderCrewList(config.crewMembers);
  }

  function renderCrewList(members) {
    const list = document.getElementById('crew-list');
    list.innerHTML = members.map((m, i) => `
      <div class="crew-row" data-index="${i}">
        <input type="text" placeholder="Nom" value="${esc(m.name)}" class="crew-name-input">
        <input type="text" placeholder="MAC (ex: 4d:74:0f:ec:e6:7f)" value="${esc(m.macAddress)}" class="crew-mac-input">
        <button type="button" class="btn-remove" onclick="removeCrewRow(this)">✕</button>
      </div>
    `).join('');
  }

  function addCrewRow(name = '', mac = '') {
    const list = document.getElementById('crew-list');
    const row = document.createElement('div');
    row.className = 'crew-row';
    row.innerHTML = `
      <input type="text" placeholder="Nom" value="${esc(name)}" class="crew-name-input">
      <input type="text" placeholder="MAC (ex: 4d:74:0f:ec:e6:7f)" value="${esc(mac)}" class="crew-mac-input">
      <button type="button" class="btn-remove" onclick="removeCrewRow(this)">✕</button>
    `;
    list.appendChild(row);
    row.querySelector('input').focus();
  }

  function removeCrewRow(btn) {
    btn.closest('.crew-row').remove();
  }

  function collectConfig() {
    const timeout = parseInt(document.getElementById('timeout').value, 10);
    const rows = document.querySelectorAll('.crew-row');
    const crewMembers = Array.from(rows).map(row => ({
      name: row.querySelector('.crew-name-input').value.trim(),
      macAddress: row.querySelector('.crew-mac-input').value.trim().toLowerCase(),
    })).filter(m => m.name && m.macAddress);
    return { alarmTimeoutSeconds: timeout, crewMembers };
  }

  async function saveConfig(event) {
    event.preventDefault();
    const config = collectConfig();
    try {
      const r = await fetch(`${API}/api/config`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(config),
      });
      if (!r.ok) { alert('Erreur lors de la sauvegarde'); return; }
      currentConfig = config;
      settingsLoaded = false; // force reload
      const msg = document.getElementById('save-msg');
      msg.classList.add('visible');
      setTimeout(() => msg.classList.remove('visible'), 2500);
      await refresh();
    } catch (e) {
      alert('Erreur réseau');
    }
  }

  async function arm() {
    // Save current settings first so arm uses latest crew list
    const config = collectConfig();
    await fetch(`${API}/api/config`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    const r = await fetch(`${API}/api/arm`, { method: 'POST' });
    if (!r.ok) { const d = await r.json(); alert(d.error || 'Erreur'); return; }
    await refresh();
  }

  async function disarm() {
    await fetch(`${API}/api/disarm`, { method: 'POST' });
    await refresh();
  }

  async function assignDevice(mac, deviceName, crewName) {
    if (!crewName) return;
    const config = collectConfig();
    if (crewName === '__new__') {
      const name = prompt('Nom du nouveau membre d\'équipage :', deviceName || '');
      if (!name) return;
      config.crewMembers.push({ name: name.trim(), macAddress: mac });
    } else {
      // Update existing member's MAC
      const member = config.crewMembers.find(m => m.name === crewName);
      if (member) {
        member.macAddress = mac;
      } else {
        config.crewMembers.push({ name: crewName, macAddress: mac });
      }
    }
    await fetch(`${API}/api/config`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    settingsLoaded = false;
    await refresh();
  }

  async function reassign(mac, newCrewName) {
    const config = collectConfig();
    if (!newCrewName) {
      // Désassigner : retirer ce MAC de tous les membres
      config.crewMembers = config.crewMembers.map(m =>
        m.macAddress.toLowerCase() === mac ? { ...m, macAddress: '' } : m
      ).filter(m => m.macAddress);
    } else {
      config.crewMembers = config.crewMembers.map(m =>
        m.name === newCrewName ? { ...m, macAddress: mac } : m
      );
    }
    await fetch(`${API}/api/config`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    settingsLoaded = false;
    await refresh();
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Initial load + auto-refresh every 2s
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
